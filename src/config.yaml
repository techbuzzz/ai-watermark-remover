# WatermarkRemover configuration.
# All keys are snake_case; unknown keys are ignored. Command-line flags override these values.

text:
  # Language-agnostic pipeline. Unicode hygiene and vendor detection are safe for
  # Latin AND Cyrillic (Russian) text: homoglyph normalisation only fires when a
  # look-alike character sits between Latin letters, so genuine Russian words are
  # never mangled. The green-list rewriter (Layer B) ships with both English and
  # Russian synonym sets.
  layers:
    unicode: true          # Layer A — strip invisible / normalising code points
    statistical: false     # Layer B — green-list synonym rewrite (EN + RU)
    vendor_specific: true  # Layer C — Claude / Gemini / OpenAI heuristics
  llm_endpoint: "http://localhost:11434"  # optional Ollama-compatible endpoint for Layer B back-translation
  llm_model: "llama3"

markdown:
  # Every key below maps 1:1 to a property on MarkdownCleanOptions.
  # The default values here MUST match the C# defaults — see
  # WatermarkRemover.Core/Configuration/AppConfig.cs (MarkdownConfig).
  # Unknown keys are ignored, so it's safe to add new ones in the future.
  strip_headings: true           # drop # / ## / … heading markers
  strip_code_fences: false       # drop the ``` fences (content preserved)
  strip_inline_code: false       # unwrap backtick `code` spans
  strip_links: false             # unwrap [text](url) links
  strip_images: true             # drop ![alt](src) images
  strip_bold_italic: false       # unwrap **bold** / *italic* / __ / _ markers
  strip_blockquotes: false       # drop the leading "> " on each line
  strip_hr: true                 # drop --- / *** / ___ horizontal-rule lines
  strip_html: true               # drop raw <tag>…</tag> blocks
  strip_comments: true           # drop <!-- … --> and [//]: # (…) comments
  strip_task_lists: false        # convert "- [ ] foo" → "- foo" / drop empty
  strip_table_syntax: false      # rewrite | a | b | rows to plain text columns
  normalize_lists: true          # convert "* item" / "+ item" → "- item"
  unwrap_empty_lists: true       # drop list items that have no content
  strip_xml_tags: true           # drop <foo/> / <bar>…</bar> (broader than strip_html)
  strip_frontmatter: true        # drop the leading --- … --- YAML block
  strip_ai_signatures: true      # drop "Generated with Claude/GPT/…" footer lines
  strip_mentions: true           # drop @user / #channel mentions
  strip_unicode_md: true         # strip invisible code points from prose
  strip_trailing_ws: true        # trim end-of-line whitespace
  apply_unicode_layer_a: true    # run the Layer A Unicode hygiene pass on prose
  preserve_code_blocks: true     # legacy knob — the cleaner always preserves
                                 # fenced code unless strip_code_fences is true;
                                 # kept for backward compatibility

image:
  model_path: "./models/big_lama_regular_inpaint.onnx"
  auto_detect_threshold: 0.4
  blend_edges: true

metadata:
  strip_c2pa: true
  strip_exif: true
  strip_xmp: true
  preserve_color_profile: true

logging:
  level: "Information"   # Verbose | Debug | Information | Warning | Error | Fatal
  output: "console"      # any combination of: console, file

server:
  # HTTP API rate-limit (only used by `serve`). The global limiter is
  # partitioned by remote IP, so each client gets its own bucket.
  # CLI flags --rate-limit / --rate-window override these at start-up.
  rate_limit:
    permit_limit: 100    # requests allowed per window, per IP
    window_seconds: 60   # window length in seconds
    queue_limit: 0       # 0 = reject immediately when the limit is hit
  # Maximum request body size for multipart uploads (clean/file, clean/image,
  # inspect/file, detect/image). Oversized uploads are rejected with HTTP 413
  # before the body is streamed to disk. 0 disables the limit (not recommended
  # for public deployments). CLI flag --max-upload-mb overrides this.
  max_upload_mb: 100

mcp:
  # `serve-mcp` (WR-S11) — expose the pipeline as Model Context Protocol
  # tools so MCP-compatible agents (Claude Code, OpenCode, MiniMax Code,
  # Cursor, Continue, …) can call clean_text / clean_markdown / clean_file
  # / clean_image / detect_text / detect_markdown / inspect_file /
  # detect_watermark directly. CLI flags --transport / --port / --api-key
  # / --rate-limit / --rate-window override these at start-up.
  #
  # transport: how the MCP server is bound.
  #   - "stdio" (default) — local stdio pipe. The right choice for
  #     Claude Code / OpenCode / MiniMax Code / Cursor / Continue. The
  #     agent spawns the process and talks JSON-RPC over stdin/stdout.
  #   - "http"             — Streamable HTTP transport. Reachable over
  #     the network; meant for remote agents and Docker deployments.
  transport: "stdio"
  # Host / port for the HTTP transport. Ignored for stdio. Port 5090
  # is distinct from `serve`'s default of 5080 so the two commands can
  # run side by side without flag-flipping.
  host: "0.0.0.0"
  port: 5090
  # API key for the HTTP transport. When set, every request must carry
  # the matching X-API-Key header — same auth pattern as `serve`.
  # Leave null (or unset) for localhost dev. Ignored for stdio (the
  # stdio pipe is the auth boundary).
  api_key: null
  # Per-IP rate-limit for the HTTP transport. When omitted, inherits
  # the `server.rate_limit` block above. Ignored for stdio.
  rate_limit:
    permit_limit: 100
    window_seconds: 60
    queue_limit: 0
