name: release

# Cut a GitHub Release for the WatermarkRemover CLI whenever a `v*` tag is
# pushed. The matrix builds a self-contained single-file executable for each
# supported runtime identifier (linux-x64, linux-arm64, win-x64, osx-x64),
# zips the publish output, and a final `release` job collects every binary
# and creates the GitHub Release with auto-generated notes.
#
# The tag (e.g. `v1.2.3`) becomes the release title; the workflow also runs
# on `workflow_dispatch` so we can rebuild and re-publish assets for an
# existing tag without re-tagging the commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish assets for (without leading 'v'). Leave empty to use $GITHUB_REF_NAME."
        required: false
        default: ""

# Cancel any in-flight run for the same tag so re-pushing a tag doesn't
# double-publish or race against an older in-progress build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` is required to create the GitHub Release and upload
# binary assets via the built-in `GITHUB_TOKEN`.
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: src/WatermarkRemover.sln
  DOTNET_VERSION: 10.0.400
  CONFIGURATION: Release
  PROJECT_PATH: src/WatermarkRemover.CLI/WatermarkRemover.CLI.csproj
  NODE_VERSION: 22

jobs:
  publish:
    name: publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: watermarkremover-linux-x64
            zip_name: watermarkremover-linux-x64.zip
          - os: ubuntu-latest
            rid: linux-arm64
            artifact_name: watermarkremover-linux-arm64
            zip_name: watermarkremover-linux-arm64.zip
          - os: windows-latest
            rid: win-x64
            artifact_name: watermarkremover-win-x64
            zip_name: watermarkremover-win-x64.zip
          - os: macos-latest
            rid: osx-x64
            artifact_name: watermarkremover-osx-x64
            zip_name: watermarkremover-osx-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Astro web UI
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci --no-audit --no-fund
          # `npm run build` runs `astro build` then `node scripts/sync.mjs`,
          # which copies dist/ → ../src/WatermarkRemover.CLI/wwwroot/. The
          # CLI csproj picks up that directory as <Content> and ships it
          # next to the published binary so `serve` can mount the UI on
          # the same port as the API.
          npm run build
          echo "Web UI bundle:"
          ls -la ../src/WatermarkRemover.CLI/wwwroot

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            %LOCALAPPDATA%\NuGet\v3-cache
            %USERPROFILE%\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Publish (self-contained, single-file)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/${{ matrix.rid }}
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -c "${{ env.CONFIGURATION }}" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:DebugType=embedded \
            --output "./publish/${{ matrix.rid }}" \
            /p:TreatWarningsAsErrors=true
          echo "Published files:"
          ls -la "./publish/${{ matrix.rid }}"

      - name: Package binary archive
        shell: bash
        run: |
          set -euo pipefail
          cd "publish/${{ matrix.rid }}"
          # Strip the per-publish PDB embedded in the single-file binary's
          # debug info before zipping (DebugType=embedded keeps symbols in
          # the binary itself; we don't want stray PDB files bloating the
          # archive).
          rm -f *.pdb
          # `zip` is available on all three runners via apt/choco/brew or
          # pre-installed on macOS. On Windows we fall back to PowerShell's
          # Compress-Archive if zip is missing.
          if command -v zip >/dev/null 2>&1; then
            zip -r "../../${{ matrix.zip_name }}" ./
          else
            powershell -NoProfile -Command "Compress-Archive -Path '.' -DestinationPath '../../${{ matrix.zip_name }}' -Force"
          fi
          cd ../..
          ls -la "${{ matrix.zip_name }}"

      # Smoke-test that the `serve-mcp` sub-command is wired into the
      # published single-file binary. The MCP SDK is a pure managed
      # library so it must travel with the bundle; a regression that
      # accidentally excluded it (e.g. trimming, R2R, or a misconfigured
      # `<TrimMode>`) would still produce a working `serve` but a broken
      # MCP integration. We exit 1 explicitly on the unsupported-Windows
      # path because the bash fallback below uses `win-x64` naming on
      # `windows-latest` and the apphost filename differs per OS.
      - name: Smoke-test `serve-mcp` sub-command
        shell: bash
        run: |
          set -euo pipefail
          cd "publish/${{ matrix.rid }}"

          # Locate the apphost. The single-file publish emits an
          # `apphost` named after the assembly on every RID:
          #   linux-x64 / linux-arm64 / osx-x64  -> `watermarkremover`
          #   win-x64                              -> `watermarkremover.exe`
          if [ -x "./watermarkremover" ]; then
            BIN="./watermarkremover"
          elif [ -x "./watermarkremover.exe" ]; then
            BIN="./watermarkremover.exe"
          else
            echo "::error::Could not locate the watermarkremover apphost in $(pwd)"
            ls -la
            exit 1
          fi

          echo "Smoke-testing $BIN serve-mcp --help …"
          "$BIN" serve-mcp --help

          # Also verify the sub-command advertises both supported
          # transports in the help text. A regression that lost
          # `--transport http` would silently degrade Docker users to
          # stdio (which is useless for `docker run -p 5090:5090`).
          HELP_OUT="$("$BIN" serve-mcp --help 2>&1 || true)"
          echo "$HELP_OUT" | grep -q -- "--transport" \
            || { echo "::error::serve-mcp --help does not mention --transport"; exit 1; }
          echo "$HELP_OUT" | grep -qE "stdio|http" \
            || { echo "::error::serve-mcp --help does not mention stdio or http"; exit 1; }
          echo "serve-mcp --help OK (transport + flags advertised)."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: create-github-release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "Downloaded artifacts:"
          ls -la artifacts/
          count=0
          for f in artifacts/*.zip; do
            [ -s "$f" ] || { echo "::error::Empty or missing archive: $f"; exit 1; }
            count=$((count + 1))
          done
          if [ "$count" -lt 4 ]; then
            echo "::error::Expected 4 platform archives, found $count"
            exit 1
          fi
          echo "All $count archives present and non-empty."

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
              && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="v${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          ASSETS=(artifacts/*.zip)

          # `--fail-on-already-exists` would be ideal but `gh release create`
          # lacks it; we tolerate the "already exists" error and fall back
          # to `gh release upload` so manual re-runs of this workflow can
          # refresh the binaries attached to a release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to existing release."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG with ${#ASSETS[@]} assets."
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"
